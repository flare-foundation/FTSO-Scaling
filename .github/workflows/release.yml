name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if stable release
        id: check
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # align with build-docker.yml: stable only for strict semver tags
          if [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        id: changelog
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$REF_NAME"
          body=$(sed -n "/^\# .*\[${tag}\]/,/^\# .*\[v/{/^\# .*\[v/!p}" CHANGELOG.md || true)
          cat >> "$GITHUB_OUTPUT" <<DELIM
          body<<EOF
          ${body}

          **Full Changelog**: https://github.com/${{ github.repository }}/blob/${tag}/CHANGELOG.md
          EOF
          DELIM

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          BODY: ${{ steps.changelog.outputs.body }}
          STABLE: ${{ steps.check.outputs.stable }}
        run: |
          args=(--title "$REF_NAME" --notes "$BODY" --verify-tag)
          if [[ "$STABLE" == "true" ]]; then
            args+=(--latest)
          else
            args+=(--prerelease --latest=false)
          fi
          gh release create "$REF_NAME" "${args[@]}"
